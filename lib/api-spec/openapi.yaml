openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: redesign
    description: Room redesign operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /styles:
    get:
      operationId: listStyles
      tags: [redesign]
      summary: List style presets
      description: Returns the available interior design style presets.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StylePreset"
  /rooms:
    get:
      operationId: listRooms
      tags: [redesign]
      summary: List room types
      description: Returns the available room types that drive product selection.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomType"
  /products:
    get:
      operationId: listProducts
      tags: [redesign]
      summary: List shoppable IKEA products
      description: Returns the IKEA product catalog. When roomTypeId is provided, returns the full pool of products eligible for that room (the swappable set), not the de-cluttered default selection.
      parameters:
        - name: roomTypeId
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          description: Market/country code (US or IN). Defaults to US.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /redesigns:
    get:
      operationId: listRedesigns
      tags: [redesign]
      summary: List saved redesigns for a device
      description: Returns the saved redesigns for the given device, newest first.
      parameters:
        - name: deviceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Redesign"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /redesigns/{id}/regenerate:
    post:
      operationId: regenerateRedesign
      tags: [redesign]
      summary: Regenerate a saved redesign with a curated set of pieces
      description: Validates the request synchronously then starts a background AI regeneration job. Returns a jobId immediately (202). Poll GET /jobs/{jobId} for completion.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreated"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /redesign:
    post:
      operationId: createRedesign
      tags: [redesign]
      summary: Redesign a room photo
      description: Validates the request synchronously then starts a background AI redesign job. Returns a jobId immediately (202). Poll GET /jobs/{jobId} for completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedesignRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCreated"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [redesign]
      summary: Poll async redesign job status
      description: Returns the current status of an async redesign or regeneration job. Poll every 2 seconds until status is "done" or "failed". Jobs expire after 2 hours.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "404":
          description: Job not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    RoomType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - description
    StylePreset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tagline:
          type: string
        description:
          type: string
        accentColor:
          type: string
        previewImage:
          type: string
          description: Relative URL path to the style preview image (served by the API).
      required:
        - id
        - name
        - tagline
        - description
        - accentColor
        - previewImage
    Product:
      type: object
      properties:
        id:
          type: string
        market:
          type: string
          description: Market/country code this product belongs to (US or IN).
        name:
          type: string
        category:
          type: string
        color:
          type: string
        price:
          type: number
        currency:
          type: string
        roomTypes:
          type: array
          items:
            type: string
          description: Room type ids this product is eligible for.
        role:
          type: string
          description: Functional role in the room (e.g. sofa, bed, rug), used for de-cluttered selection.
        group:
          type: string
          description: Broad category bucket (e.g. Lighting, Seating, Storage) used for high-level swap filtering, with role as the narrow filter.
        imageUrl:
          type: string
          description: Relative URL path to the product image (served by the API).
        buyUrl:
          type: string
          description: Link to purchase the product on IKEA.
      required:
        - id
        - market
        - name
        - category
        - color
        - price
        - currency
        - roomTypes
        - role
        - group
        - imageUrl
        - buyUrl
    RedesignRequest:
      type: object
      properties:
        image:
          type: string
          description: Base64-encoded room photo (no data URI prefix).
        styleId:
          type: string
        roomTypeId:
          type: string
        deviceId:
          type: string
          description: Anonymous device identifier the redesign is saved under.
        market:
          type: string
          description: Market/country code for product selection (US or IN). Defaults to US.
        isSubscribed:
          type: boolean
          description: Whether the device has an active Pro subscription (used for server-side rate limiting).
        productIds:
          type: array
          items:
            type: string
          description: Optional subset of the room's auto-selected product ids to include. When omitted or empty, the server's default de-cluttered selection is used.
      required:
        - image
        - styleId
        - roomTypeId
        - deviceId
    RegenerateRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Anonymous device identifier that owns the redesign.
        market:
          type: string
          description: Market/country code for product lookup (US or IN). Defaults to US.
        isSubscribed:
          type: boolean
          description: Whether the device has an active Pro subscription (used for server-side rate limiting).
        productIds:
          type: array
          items:
            type: string
          description: The curated set of product ids to ground the regenerated room in.
      required:
        - deviceId
        - productIds
    JobCreated:
      type: object
      properties:
        jobId:
          type: string
          description: Unique identifier for the async job. Use with GET /jobs/{jobId} to poll status.
      required:
        - jobId
    JobStatus:
      type: object
      properties:
        status:
          type: string
          enum: [pending, done, failed]
          description: Current job state.
        redesign:
          $ref: "#/components/schemas/Redesign"
          description: Present only when status is "done".
        error:
          type: string
          description: Human-readable error message. Present only when status is "failed".
      required:
        - status
    Redesign:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: integer
          description: Creation time as epoch milliseconds.
        deviceId:
          type: string
        styleId:
          type: string
        styleName:
          type: string
        roomTypeId:
          type: string
        roomName:
          type: string
        originalImage:
          type: string
          description: Base64-encoded original room photo.
        redesignedImage:
          type: string
          description: Base64-encoded redesigned room image (PNG).
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
      required:
        - id
        - createdAt
        - deviceId
        - styleId
        - styleName
        - roomTypeId
        - roomName
        - originalImage
        - redesignedImage
        - products
